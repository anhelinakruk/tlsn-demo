[workspace]
resolver = "3"
members = ["demo", "tlsn-prover"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
pest = "2"
pest_derive = "2"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
smol = "2"
async-compat = "0.2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = { version = "1.14", features = ["web"] }
salvo-http3 = { version = "0.7", features = ["quinn"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"
salvo = { version = "0.93", default-features = false, features = [
  "http1",
  "server",
  "quinn",
  "rustls",
  "aws-lc-rs",
  "affix-state",
  "serve-static",
] }
tlsn = { git = "https://github.com/neotheprogramist/tlsn", branch = "feat/poseidon-alpha15", default-features = false }
